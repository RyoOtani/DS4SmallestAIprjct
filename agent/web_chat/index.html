<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinyLLM Chat — Multi-Backend AI</title>
<style>
:root {
  --bg: #0f0f1a; --surface: #1a1a2e; --elevated: #222240;
  --primary: #6366f1; --accent: #f472b6; --success: #34d399;
  --text: #e2e8f0; --text-dim: #94a3b8; --text-muted: #64748b;
  --border: #2d2d5a; --code-bg: #0d1117;
  --radius: 14px; --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
               'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  background: var(--bg); color: var(--text); height:100vh;
  display:flex; flex-direction:column; overflow:hidden;
}

/* Header */
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 20px; display:flex; align-items:center; gap:10px; z-index:10;
}
header .logo { font-size:1.3em; }
header h1 { font-size:1em; font-weight:600; }
header .spacer { flex:1; }
header .model-badge {
  font-size:0.72em; background: var(--elevated); border: 1px solid var(--border);
  padding:5px 12px; border-radius:20px; color: var(--text-dim);
  cursor:pointer; transition: all .2s; white-space:nowrap; display:flex; align-items:center; gap:5px;
}
header .model-badge:hover { border-color: var(--primary); color: var(--text); }
header .model-badge .dot { width:7px; height:7px; border-radius:50%; background:var(--success); }
header .settings-btn {
  background:none; border:1px solid var(--border); color: var(--text-dim);
  font-size:1.1em; cursor:pointer; padding:6px 10px; border-radius: var(--radius-sm); transition: all .2s;
}
header .settings-btn:hover { color: white; border-color: var(--primary); background: var(--elevated); }

/* Main */
main { flex:1; overflow-y:auto; padding: 20px 24px; display:flex; flex-direction:column; gap:18px; }
main::-webkit-scrollbar { width:5px; }
main::-webkit-scrollbar-track { background:transparent; }
main::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }

/* Messages */
.message { display:flex; gap:10px; max-width:820px; animation: fadeUp .35s ease; }
.message.user { align-self:flex-end; flex-direction:row-reverse; }
.message.assistant { align-self:flex-start; }
.avatar {
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:1em; flex-shrink:0;
  background: var(--elevated); border: 1px solid var(--border);
}
.message.user .avatar { background: var(--primary); border-color: var(--primary); }
.bubble {
  padding: 14px 18px; border-radius: var(--radius); line-height:1.65; font-size:0.92em;
}
.message.user .bubble {
  background: linear-gradient(135deg, #6366f1, #8b5cf6); color:white; border-bottom-right-radius:4px;
}
.message.assistant .bubble {
  background: var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px;
}
.bubble .msg-time { font-size:0.68em; color: var(--text-muted); margin-top:6px; }
.message.user .bubble .msg-time { color: rgba(255,255,255,0.5); }

/* Code */
.bubble pre {
  background: var(--code-bg); padding:14px 16px; border-radius: var(--radius-sm);
  overflow-x:auto; margin:10px 0; font-size:0.82em; line-height:1.5;
  border: 1px solid var(--border);
}
.bubble code { font-family: 'JetBrains Mono', 'Fira Code', 'Menlo', monospace; }
.bubble pre code { background:none; padding:0; font-size:0.9em; }
.bubble p code { background: var(--code-bg); padding:2px 6px; border-radius:4px; font-size:0.88em; border:1px solid var(--border); }
.code-header {
  display:flex; justify-content:space-between; align-items:center;
  background: var(--elevated); padding:6px 14px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  font-size:0.72em; color: var(--text-dim); border:1px solid var(--border); border-bottom:none;
}
.code-header + pre { margin-top:0; border-top-left-radius:0; border-top-right-radius:0; }
.copy-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  padding:2px 8px; border-radius:4px; font-size:0.9em; cursor:pointer; transition: all .2s;
}
.copy-btn:hover { border-color: var(--primary); color: var(--text); }
.copy-btn.copied { border-color: var(--success); color: var(--success); }

/* Tool blocks */
.tool-call, .tool-result { padding:10px 14px; margin:8px 0; border-radius: var(--radius-sm); font-size:0.82em; }
.tool-call { background: #0d3325; border-left:3px solid var(--success); color:#6ee7b7; }
.tool-result { background: #332a0d; border-left:3px solid #f59e0b; color:#fcd34d; }
.thinking { color: var(--text-dim); font-style:italic; font-size:0.82em; padding:4px 0; }

/* Typing */
.typing-dots { display:flex; gap:4px; padding:8px 0; }
.typing-dots span { width:7px; height:7px; border-radius:50%; background:var(--text-dim); animation:typing 1.4s infinite; }
.typing-dots span:nth-child(2) { animation-delay:.2s; }
.typing-dots span:nth-child(3) { animation-delay:.4s; }
@keyframes typing { 0%,60%,100%{opacity:0.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-4px)} }

/* Footer */
footer { background: var(--surface); border-top: 1px solid var(--border); padding: 14px 20px; }
.input-row { display:flex; gap:10px; max-width:820px; margin:0 auto; align-items:flex-end; }
.input-row textarea {
  flex:1; background: var(--elevated); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding:12px 16px; font-size:0.92em; resize:none; min-height:46px; max-height:180px;
  font-family: inherit; line-height:1.5; transition: border-color .2s;
}
.input-row textarea:focus { outline:none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
.input-row textarea::placeholder { color: var(--text-muted); }
.send-btn {
  background: var(--primary); color:white; border:none;
  border-radius: var(--radius); padding:12px 20px; font-size:0.95em; font-weight:600;
  cursor:pointer; transition: all .2s; height:46px; white-space:nowrap;
}
.send-btn:hover { background: #5558e6; transform: translateY(-1px); }
.send-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
.send-hint { font-size:0.68em; color: var(--text-muted); text-align:center; margin-top:6px; }
.tools-bar { display:flex; gap:12px; margin-top:8px; font-size:0.75em; color:var(--text-dim); max-width:820px; margin-left:auto; margin-right:auto; }
.tools-bar label { display:flex; align-items:center; gap:4px; cursor:pointer; }
.tools-bar input[type=checkbox] { accent-color: var(--primary); }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75);
    z-index:100; justify-content:center; align-items:center; backdrop-filter:blur(4px); }
.modal-overlay.open { display:flex; }
.modal {
  background: var(--surface); border-radius: var(--radius); padding:28px;
  max-width:480px; width:92%; max-height:85vh; overflow-y:auto;
  border: 1px solid var(--border); box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
.modal h2 { font-size:1.1em; margin-bottom:18px; }
.modal label { display:block; font-size:0.82em; color:var(--text-dim); margin-bottom:4px; font-weight:500; }
.modal select, .modal input {
  width:100%; padding:10px 14px; border-radius: var(--radius-sm);
  background: var(--elevated); color: var(--text); border:1px solid var(--border);
  font-size:0.9em; margin-bottom:14px; font-family: inherit; transition: border-color .2s;
}
.modal select:focus, .modal input:focus { outline:none; border-color: var(--primary); }
.modal .hint { font-size:0.72em; color: var(--text-muted); margin-bottom:14px; line-height:1.5; }
.modal .hint.warn { color: #f59e0b; }
.modal .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }
.btn { padding:8px 20px; border-radius: var(--radius-sm); font-size:0.88em; border:none; cursor:pointer; font-weight:600; transition: all .2s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #5558e6; }
.btn-secondary { background: var(--elevated); color: var(--text-dim); border:1px solid var(--border); }
.btn-secondary:hover { color: var(--text); border-color: var(--text-dim); }

/* Animations */
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

/* Empty State */
.empty-state { text-align:center; padding:60px 20px; }
.empty-state .icon { font-size:3em; margin-bottom:12px; }
.empty-state h2 { font-size:1.3em; margin-bottom:6px; font-weight:600; }
.empty-state p { color: var(--text-dim); font-size:0.9em; line-height:1.6; }
.quick-chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }
.quick-chip {
  background: var(--elevated); border:1px solid var(--border); color: var(--text-dim);
  padding:8px 16px; border-radius:20px; font-size:0.82em; cursor:pointer; transition: all .2s;
}
.quick-chip:hover { border-color: var(--primary); color: var(--text); }
</style>
</head>
<body>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>⚙️ モデル設定</h2>
    <label>🤖 モデルを選択</label>
    <select id="providerSelect"></select>
    <div id="apiKeyGroup" style="display:none">
      <label>🔑 APIキー</label>
      <input type="password" id="apiKeyInput" placeholder="sk-... （サーバーメモリのみ保持）">
      <div class="hint warn">⚠️ サーバーメモリのみ保持。ディスク非保存・再起動で消去</div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="closeSettings()">キャンセル</button>
      <button class="btn btn-primary" onclick="applySettings()">✓ 適用</button>
    </div>
  </div>
</div>

<!-- Header -->
<header>
  <span class="logo">🧠</span>
  <h1>TinyLLM Chat</h1>
  <span class="spacer"></span>
  <button class="model-badge" id="modelBadge" onclick="openSettings()">
    <span class="dot" id="providerDot"></span><span id="modelLabel">🧩 RuleBased</span>
  </button>
  <button class="settings-btn" onclick="openSettings()" title="設定">⚙️</button>
</header>

<!-- Chat Area -->
<main id="chat"></main>

<!-- Footer -->
<footer>
  <div class="input-row">
    <textarea id="prompt" rows="1" placeholder="メッセージを入力...（Shift+Enterで改行 / Ctrl+Enterで送信）"></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()">▶ 送信</button>
  </div>
  <div class="tools-bar">
    <label><input type="checkbox" id="webSearch" checked> 🌐 Web検索</label>
    <label><input type="checkbox" id="useAgent"> 🧠 エージェント</label>
    <span style="margin-left:auto;opacity:0.6" id="tokenCount"></span>
  </div>
  <div class="send-hint">💡 Shift+Enterで改行 ｜ Ctrl+Enter または ▶送信 ボタンで送信</div>
</footer>

<script>
const API = '/v1/chat', CFG = '/v1/config', PROV = '/v1/providers';
let convId = Date.now().toString(36);
let currentProviderId = 'template';

// ★ IME composition tracking — fixes Japanese input
let isComposing = false;
const ta = document.getElementById('prompt');
ta.addEventListener('compositionstart', () => { isComposing = true; });
ta.addEventListener('compositionend', () => { isComposing = false; });
ta.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !isComposing) {
    e.preventDefault(); send();
  }
  setTimeout(() => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 180) + 'px';
  }, 0);
});

// Provider list
async function loadProviders() {
  try {
    const r = await fetch(PROV); const d = await r.json();
    const sel = document.getElementById('providerSelect');
    sel.innerHTML = '';
    for (const p of d.providers) {
      const o = document.createElement('option');
      o.value = p.id; o.textContent = p.label;
      if (p.requires_api_key) o.dataset.needsKey = '1';
      sel.appendChild(o);
    }
    sel.value = currentProviderId;
    sel.onchange = toggleApiKey;
    toggleApiKey();
  } catch(e) {}
}
function toggleApiKey() {
  const sel = document.getElementById('providerSelect');
  const needs = sel.selectedOptions[0]?.dataset?.needsKey === '1';
  document.getElementById('apiKeyGroup').style.display = needs ? 'block' : 'none';
}

// Settings
async function openSettings() {
  document.getElementById('settingsModal').classList.add('open');
  if (document.getElementById('providerSelect').children.length === 0) await loadProviders();
  try {
    const r = await fetch(CFG); const d = await r.json();
    document.getElementById('providerSelect').value = d.provider_id;
    currentProviderId = d.provider_id;
    toggleApiKey();
  } catch(e) {}
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
async function applySettings() {
  const pid = document.getElementById('providerSelect').value;
  const key = document.getElementById('apiKeyInput').value.trim();
  try {
    const r = await fetch(CFG, { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({provider_id:pid, api_key:key||undefined}) });
    const d = await r.json();
    currentProviderId = d.provider_id;
    document.getElementById('modelLabel').textContent = d.provider_label || pid;
    closeSettings();
    document.getElementById('apiKeyInput').value = '';
  } catch(e) { alert('設定失敗: '+e.message); }
}

// Markdown
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMD(text) {
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_,lang,code) =>
    `<div class="code-header"><span>📄 ${lang||'code'}</span><button class="copy-btn" onclick="copyCode(this)">📋 コピー</button></div><pre><code>${esc(code.trim())}</code></pre>`);
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\n/g, '<br>');
  return text;
}
function copyCode(btn) {
  const code = btn.closest('.code-header').nextElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent='✅ 完了'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 コピー';btn.classList.remove('copied')},2000);
  }).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=code;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent='✅ 完了'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 コピー';btn.classList.remove('copied')},2000);
  });
}

// Messages
function addMsg(role, content, extra) {
  const main = document.getElementById('chat');
  const es = main.querySelector('.empty-state'); if (es) es.remove();
  const div = document.createElement('div');
  div.className = 'message ' + role;
  const avatar = role === 'user' ? '👤' : '🤖';
  const time = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'});
  let h = `<div class="avatar">${avatar}</div><div class="bubble">`;
  if (extra?.thinking) h += `<div class="thinking">💭 ${extra.thinking}</div>`;
  if (extra?.tool_calls) for (const t of extra.tool_calls) h += `<div class="tool-call">🔧 ${esc(t.name)}</div>`;
  if (extra?.tool_results) for (const t of extra.tool_results) h += `<div class="tool-result">📋 ${esc(t.name)}</div>`;
  h += fmtMD(content) + `<div class="msg-time">${time}</div></div>`;
  div.innerHTML = h;
  main.appendChild(div);
  main.scrollTop = main.scrollHeight;
  return div.querySelector('.bubble');
}

// Send
async function send() {
  const prompt = document.getElementById('prompt');
  const btn = document.getElementById('sendBtn');
  const text = prompt.value.trim();
  if (!text) return;
  prompt.value = ''; prompt.style.height = 'auto'; btn.disabled = true;
  const ws = document.getElementById('webSearch').checked;
  const ag = document.getElementById('useAgent').checked;
  addMsg('user', text);
  const bubble = addMsg('assistant', '<div class="typing-dots"><span></span><span></span><span></span></div>');
  try {
    const r = await fetch(API, { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt:text, conversation_id:convId,
        web_search:ws, agent_mode:ag, max_tokens:2048, temperature:0.7}) });
    const d = await r.json();
    let content = d.response || d.text || JSON.stringify(d);
    // Rebuild bubble
    bubble.innerHTML = '';
    if (d.thinking) { const t=document.createElement('div'); t.className='thinking'; t.textContent='💭 '+d.thinking; bubble.appendChild(t); }
    if (d.tool_calls) for (const tc of d.tool_calls) { const t=document.createElement('div'); t.className='tool-call'; t.textContent='🔧 '+tc.name; bubble.appendChild(t); }
    bubble.innerHTML += fmtMD(content);
    const tm = document.createElement('div'); tm.className='msg-time';
    tm.textContent = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'});
    bubble.appendChild(tm);
    if (d.provider) {
      document.getElementById('modelLabel').textContent = d.provider;
      const dot = document.getElementById('providerDot');
      if (d.provider.includes('⚠️')) dot.style.background = '#f472b6';
      else if (d.provider.includes('via')) dot.style.background = '#f59e0b';
      else dot.style.background = '#34d399';
    }
    document.getElementById('tokenCount').textContent = 'Tokens: '+(d.usage?.total_tokens||'?');
  } catch(e) {
    bubble.innerHTML = `<span style="color:#f472b6">❌ エラー: ${esc(e.message)}</span>`;
  }
  btn.disabled = false; prompt.focus();
}

// Quick ask
function quickAsk(t) { document.getElementById('prompt').value = t; send(); }

// Init
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('chat').innerHTML = `<div class="empty-state">
    <div class="icon">🧠</div><h2>TinyLLM Chat</h2>
    <p>🌐 Web検索 + 🧠 エージェント + 🔀 マルチモデル対応</p>
    <p style="margin-top:6px">⚙️ 右上から OpenAI / DeepSeek / TinyLLM を切替可能</p>
    <div class="quick-chips">
      <span class="quick-chip" onclick="quickAsk('Pythonでフィボナッチ関数を書いて')">🐍 コーディング</span>
      <span class="quick-chip" onclick="quickAsk('最新のAIニュースを教えて')">📰 最新ニュース</span>
      <span class="quick-chip" onclick="quickAsk('Rustの所有権システムを説明して')">🦀 Rust解説</span>
      <span class="quick-chip" onclick="quickAsk('Reactでカウンターアプリを作るには？')">⚛️ React</span>
    </div>
  </div>`;
  fetch(CFG).then(r=>r.json()).then(d=>{
    document.getElementById('modelLabel').textContent = d.provider_label || '🧩 RuleBased';
    currentProviderId = d.provider_id;
  }).catch(()=>{});
});
</script>
</body>
</html>
